# =============================================================================
# OMNITWIN — Continuous Integration
# =============================================================================
# Six jobs run in parallel against every push to master or the dedicated
# Grand Hall staging branch, and every pull request targeting master:
#
#   audit      - pnpm audit at moderate severity and above
#   lint       — ESLint v9 across all packages, zero errors required
#   typecheck  — `tsc --noEmit` across all packages, zero errors required
#   build      — Production build for every package
#   test       — Vitest across all packages, all tests must pass
#   e2e        — Playwright E2E against a Vite dev server (Chromium only)
#
# Each job is fully isolated and reproducible: pnpm version is pinned to
# match the local development environment, the lockfile is enforced via
# --frozen-lockfile, and Node 22 (current LTS) is the only supported runtime.
#
# E2E notes:
#   - All API calls are intercepted with page.route() — no backend required
#   - Playwright starts the Vite dev server itself via playwright.config.ts
#     webServer config (reuseExistingServer: false in CI)
#   - On failure, screenshots and traces from test-results/ are uploaded as
#     a workflow artifact for debugging
# =============================================================================

name: CI

on:
  push:
    branches: [master, codex/grand-hall-exact-runtime]
  pull_request:
    branches: [master]

# Cancel any in-flight runs for the same ref when a new commit lands —
# saves CI minutes when force-pushing or rapid-iterating on a PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm -r lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm -r typecheck

  # A gate that never compiles the product is not a gate. Until this job
  # existed, Vercel was the first thing to discover a broken bundle —
  # typecheck passes on code that `vite build` still refuses (a bad dynamic
  # import, a missing asset, an env assertion), and the api/foundry `tsc`
  # BUILD configs are not the same as their --noEmit ones.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        # These are documented non-deployable build-CHECK fixtures, not
        # credentials. The explicit local context keeps this path separate
        # from Vercel's provider-bound staging/production assertions. The
        # compiled artifact is discarded and must never be served.
        env:
          VENVIEWER_WEB_LOCAL_BUILD_CONTEXT: reviewed-local-only
          VITE_API_URL: https://api.venviewer.com
          VITE_CLERK_PUBLISHABLE_KEY: pk_live_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          VITE_DEPLOYMENT_TIER: production
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @omnitwin/types (required by api and web test runtimes)
        # api/web tests import from `@omnitwin/types` which resolves to
        # `dist/index.js` per the package's `main` / `exports` fields.
        # Without this step vite's import-analysis fails at test time with
        # "Failed to resolve entry for package @omnitwin/types". Source
        # lives in src/ but runtime consumers need the compiled bundle.
        run: pnpm --filter @omnitwin/types build

      - name: Claim safety guard
        run: pnpm --filter @omnitwin/web exec vitest run src/__tests__/public-claim-guard.test.ts

      - name: Test (Vitest)
        # --no-bail: without it, pnpm stops at the FIRST failing package, so a
        # red package hides every package after it. That is how three latent
        # Linux-only defects in @omnitwin/reconstruction-foundry stayed
        # invisible for nine days behind packages/web, then surfaced together.
        # Failures still fail the job (verified: exit code 1 with --no-bail);
        # this only ensures every package reports on the day it breaks.
        run: pnpm -r --no-bail test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # The full Chromium suite now covers the cinematic planner, landing
    # planner, private-brief guard, and mobile/tablet matrices. Fifteen minutes
    # was cancelling healthy runs before Playwright could finish and upload
    # artifacts; keep this above normal runtime while still bounding hangs.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @omnitwin/types (required by the Vite dev server Playwright boots)
        run: pnpm --filter @omnitwin/types build

      - name: Install Playwright browsers
        # --with-deps installs OS-level Chromium system dependencies on Ubuntu
        # (libgtk, libnss, etc.) in addition to the browser binary itself.
        # Only Chromium is installed because playwright.config.ts defines a
        # single "chromium" project — skipping Firefox/WebKit saves ~300 MB.
        run: pnpm --filter @omnitwin/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @omnitwin/web e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          # Default outputDir is ./test-results relative to playwright.config.ts
          # (packages/web/). Contains screenshots (only-on-failure) and traces
          # (on-first-retry) as configured in playwright.config.ts.
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
