# =============================================================================
# OMNITWIN — Continuous Integration
# =============================================================================
# Checks run against every push to master and every pull request targeting master:
#
#   audit      - pnpm audit at moderate severity and above
#   lint       — ESLint v9 across all packages, zero errors required
#   typecheck  — `tsc --noEmit` across all packages, zero errors required
#   build      — production builds across all packages
#   native-image — actual Linux API image and native decoder boundary checks
#   test       — required migrated PostgreSQL regressions and workspace Vitest
#   e2e        — four CPU shards, with the exact GPU file excluded before sharding
#   gate-tooling — receipt, inventory, source and worker boundary regressions
#   gpu-required — authenticated, bounded hardware run of all five Twin cases
#   browser-gate — independently collected full inventory and required CPU/GPU union
#
# Each job is fully isolated and reproducible: pnpm version is pinned to
# match the local development environment, the lockfile is enforced via
# --frozen-lockfile, and Node 22 is the supported runtime.
#
# E2E notes:
#   - All API calls are intercepted with page.route() — no backend required
#   - Playwright starts the Vite dev server itself via playwright.config.ts
#     webServer config (reuseExistingServer: false in CI)
#   - On failure, screenshots and traces from test-results/ are uploaded as
#     a workflow artifact for debugging
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel any in-flight runs for the same ref when a new commit lands —
# saves CI minutes when force-pushing or rapid-iterating on a PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm -r lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm -r typecheck

  # A gate that never compiles the product is not a gate. Until this job
  # existed, Vercel was the first thing to discover a broken bundle —
  # typecheck passes on code that `vite build` still refuses (a bad dynamic
  # import, a missing asset, an env assertion), and the api/foundry `tsc`
  # BUILD configs are not the same as their --noEmit ones.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        # The web build asserts a Clerk publishable key is present. This is
        # the documented build-CHECK fixture, not a credential: it proves the
        # bundle compiles and the artifact is discarded. A bundle built with
        # it must never be served — a real deploy supplies the real key.
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_live_localbuildcheck
        run: pnpm build

  native-image:
    name: API Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the production Linux API image
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p native-image-results
          git rev-parse HEAD HEAD^{tree} > native-image-results/checkout-identity.txt
          printf 'event=%s\ncheckout=%s\npr_head=%s\npr_base=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" \
            > native-image-results/event-identity.txt
          docker build --platform linux/amd64 --iidfile native-image-results/image-id.txt \
            --build-arg BUILD_GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_APP_VERSION=0.0.4 \
            --build-arg BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
          docker image inspect "$(cat native-image-results/image-id.txt)" \
            > native-image-results/image-inspect.json

      - name: Verify the shipped native decoder and image boundaries
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network none --read-only --memory 2g --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.github/scripts/verify-api-native-image.mjs,target=/tmp/native-image-check.mjs,readonly" \
            "$(cat native-image-results/image-id.txt)" \
            node --conditions=omnitwin-dist /tmp/native-image-check.mjs \
            | tee native-image-results/runtime-and-fixtures.jsonl

      - name: Upload native image receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-image-results-${{ github.run_id }}
          path: native-image-results/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      route-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venviewer_route_atomicity_test
        ports:
          - 55476:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venviewer_route_atomicity_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      platform-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venviewer_platform_test
        ports:
          - 55477:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venviewer_platform_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @omnitwin/types (required by api and web test runtimes)
        # api/web tests import from `@omnitwin/types` which resolves to
        # `dist/index.js` per the package's `main` / `exports` fields.
        # Without this step vite's import-analysis fails at test time with
        # "Failed to resolve entry for package @omnitwin/types". Source
        # lives in src/ but runtime consumers need the compiled bundle.
        run: pnpm --filter @omnitwin/types build

      - name: Required platform PostgreSQL migrations and regressions
        timeout-minutes: 10
        env:
          # The runner rejects missing/unsafe targets and skipped tests. This
          # service is disposable; DATABASE_URL and env files are not used.
          VENVIEWER_PLATFORM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55477/venviewer_platform_test
        run: pnpm --filter @omnitwin/api test:platform-db

      - name: Upload platform PostgreSQL receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-postgres-results-${{ github.run_id }}
          path: packages/api/.test-results/platform-db/
          if-no-files-found: warn
          retention-days: 7

      - name: Claim safety guard
        run: pnpm --filter @omnitwin/web exec vitest run src/__tests__/public-claim-guard.test.ts

      - name: Create dedicated event access test database
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host=127.0.0.1 --port=55477 --username=postgres --dbname=postgres
          --no-psqlrc --set=ON_ERROR_STOP=1
          --command="CREATE DATABASE venviewer_event_access_test"

      - name: Required event access PostgreSQL migrations and regressions
        timeout-minutes: 10
        env:
          # Separate database; never reuse the platform or production fixture.
          # The gate rejects missing/unsafe targets and skipped SQL tests.
          VENVIEWER_EVENT_ACCESS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55477/venviewer_event_access_test
        run: pnpm --filter @omnitwin/api test:event-access-db

      - name: Upload event access PostgreSQL receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-access-postgres-results-${{ github.run_id }}
          path: packages/api/.test-results/event-access-db/
          if-no-files-found: warn
          retention-days: 7

      - name: Setup Python for twin-forge E57 guards
        # tools/twin-forge's e57-script-guards.test.ts shells out to the
        # Python unittest suite under e57-scripts/tests. Those modules (and
        # the production modules they import) need numpy, scipy, Pillow and
        # pye57; the hosted runner's Python ships with none of them, so 8
        # of the suite's 17 tests died at import and the whole Test job
        # went red (master, from 2026-08-28). The unittest loader stops at
        # the FIRST missing import per module, so only numpy showed in the
        # log — the full set comes from grepping the modules' imports.
        # setup-python puts a pip-friendly interpreter first on PATH (the
        # OS python is PEP 668 externally-managed and refuses pip).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps for twin-forge E57 guards
        run: python3 -m pip install numpy scipy Pillow pye57

      - name: Test (Vitest)
        # Use the same execution policy locally and in CI: serial workspaces
        # avoid contention between heavy suites, while --no-bail ensures a
        # failed package does not hide later failures. Any failure still
        # produces a non-zero exit code.
        env:
          # Ephemeral local fixture only; never load or override DATABASE_URL.
          VENVIEWER_ROUTE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55476/venviewer_route_atomicity_test
        run: pnpm test

  e2e:
    name: E2E CPU (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Every non-GPU Chromium case executes across isolated single-worker shards.
    # The final browser-gate independently requires the complete CPU/GPU union;
    # excluding the exact GPU file here cannot produce a green release by itself.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Playwright's shorter global timeout leaves room to flush failure details
    # and upload screenshots/traces before Actions terminates the runner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @omnitwin/types (required by the Vite dev server Playwright boots)
        run: pnpm --filter @omnitwin/types build

      - name: Install Playwright browsers
        # --with-deps installs OS-level Chromium system dependencies on Ubuntu
        # (libgtk, libnss, etc.) in addition to the browser binary itself.
        # Only Chromium is installed because playwright.config.ts defines a
        # single "chromium" project — skipping Firefox/WebKit saves ~300 MB.
        run: pnpm --filter @omnitwin/web exec playwright install --with-deps chromium

      - name: Record the scheduled browser inventory
        run: |
          mkdir -p packages/web/playwright-report
          pnpm --filter @omnitwin/web exec playwright test --list --test-list-invert=../../.github/gpu/gpu-tests.txt --shard=${{ matrix.shard }}/4 --update-snapshots=none --reporter=json > packages/web/playwright-report/inventory.json

      - name: Run E2E tests
        # Native ANGLE/OpenGL capture tests need an X display. Playwright's
        # installed Ubuntu dependencies already include Xvfb; Chromium remains
        # headless, with the same scene detail, assertions and timing budgets.
        run: xvfb-run --auto-servernum pnpm --filter @omnitwin/web e2e --test-list-invert=../../.github/gpu/gpu-tests.txt --shard=${{ matrix.shard }}/4 --update-snapshots=none

      - name: Bind CPU artifacts to this checkout and run attempt
        if: always()
        run: node .github/gpu/reconcile-browser.mjs record-cpu --directory packages/web/playwright-report --shard ${{ matrix.shard }}

      - name: Upload Playwright results and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          # Default outputDir is ./test-results relative to playwright.config.ts
          # (packages/web/). Contains screenshots (only-on-failure) and traces
          # (on-first-retry) as configured in playwright.config.ts.
          path: |
            packages/web/test-results/
            packages/web/playwright-report/
          if-no-files-found: error
          retention-days: 7

  gate-tooling:
    name: Browser gate tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify receipt, authenticated bridge and inventory boundaries
        run: node --test .github/gpu/*.test.mjs

      - name: Verify committed source and isolated worker boundaries
        run: |
          python3 - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('.github/gpu', pattern='test_*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No Python GPU boundary tests were discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  gpu-required:
    name: GPU performance (required)
    needs: gate-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare exact-source GPU request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/gpu/hosted-gate.mjs prepare --output-dir gpu-evidence

      - name: Publish request for the isolated operator
        uses: actions/upload-artifact@v4
        with:
          name: gpu-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gpu-evidence/request.json
            gpu-evidence/trusted.json
            gpu-evidence/READY.json
          if-no-files-found: error
          retention-days: 7

      - name: Require authenticated GPU evidence before expiry
        timeout-minutes: 27
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/gpu/hosted-gate.mjs wait --output-dir gpu-evidence

      - name: Preserve GPU request and received evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: gpu-evidence/
          if-no-files-found: error
          retention-days: 14

  browser-gate:
    name: Browser release gate
    needs: [gate-tooling, e2e, gpu-required]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout independently for complete inventory
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared runtime for test discovery
        run: pnpm --filter @omnitwin/types build

      - name: Independently collect every browser case and committed source
        run: |
          mkdir -p browser-gate-evidence
          pnpm --filter @omnitwin/web exec playwright test --list --update-snapshots=none --reporter=json > browser-gate-evidence/full-inventory.json
          python3 .github/gpu/source_manifest.py --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" > browser-gate-evidence/source.json

      - name: Download all CPU shard receipts from this run attempt
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: browser-artifacts

      - name: Download required GPU evidence from this run attempt
        uses: actions/download-artifact@v4
        with:
          name: gpu-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-gate-evidence/gpu

      - name: Require the complete unchanged browser inventory and both jobs
        env:
          TOOLING_JOB_RESULT: ${{ needs.gate-tooling.result }}
          CPU_JOB_RESULT: ${{ needs.e2e.result }}
          GPU_JOB_RESULT: ${{ needs.gpu-required.result }}
        run: >-
          node .github/gpu/reconcile-browser.mjs verify
          --artifacts-root browser-artifacts
          --inventory browser-gate-evidence/full-inventory.json
          --source browser-gate-evidence/source.json
          --gpu-directory browser-gate-evidence/gpu
          --output browser-gate-evidence/reconciliation.json

      - name: Preserve complete browser gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-gate-evidence/
          if-no-files-found: error
          retention-days: 14
