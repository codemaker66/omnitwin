# =============================================================================
# VENVIEWER — Event rules (the spine's links, T-704)
# =============================================================================
# Every night, and by hand right after a release: joins the proposals, deals
# and enquiries made since the last run to their events (the join of old
# records, spine_join_old_records), then reads the bind's two counts and the
# spine's nine and prints one line of JSON, with the database's migration
# state (docs/engineering/the-spine.md).
#
# It reports and turns red; it blocks nothing. No other workflow waits on it,
# and Railway releases by itself. A red run is expected while a question is
# open on the list of joins to check.
#
# The --join flag goes when the rule is tightened (stage 6); this then only
# reads.
#
# To stop the nightly write in an emergency, disable THIS workflow (Actions →
# Event rules → Disable workflow; it stops nothing else), or run it by hand
# with join set to false, which reads without writing.
#
# The log is public with the repository: the line carries counts, reasons and
# migration tags only, and a failure is named by its error's name and SQLSTATE,
# never by its message or the connection string.
#
# Requires the DATABASE_URL secret in the repository settings, the one the
# Scheduled Cleanup reads. No environment, so no approval holds it.
# =============================================================================

name: Event rules (reports only; blocks nothing)

on:
  # Once a night at 01:23 UTC, off the hour. GitHub may start a scheduled run
  # hours late (into the venue's working morning), so what protects the
  # working day is the join's short limits (5 s for a lock, 60 s in all, and
  # it never waits for a row it can skip), not the hour.
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      join:
        description: "Join new records to their events before reading (false: read only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two joins at once would be safe (each skips what the other holds) but
  # would split one night's work across two reports.
  group: event-rules-join
  cancel-in-progress: false

jobs:
  event-rules:
    name: Event rules (reports only; blocks nothing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @omnitwin/types (required by api)
        run: pnpm --filter @omnitwin/types build

      # The schedule always joins; a run by hand joins unless join is false.
      - name: Join new records and read the event rules
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.join }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @omnitwin/api exec tsx src/scripts/check-booking-event-bind.ts --join

      - name: Read the event rules (no join)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.join }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @omnitwin/api exec tsx src/scripts/check-booking-event-bind.ts
