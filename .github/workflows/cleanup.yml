# =============================================================================
# OMNITWIN — Scheduled Cleanup
# =============================================================================
# Runs daily at 02:00 UTC to remove:
#   1. Stale preview configurations (unclaimed, >72h old, no enquiry)
#   2. Orphaned uploads (loadout context, >24h old, no photo link): the
#      object in the private uploads bucket, then its row
#   3. Guests' allergy notes past their retention (30 days after the event),
#      from layouts and their event sheets, as the privacy policy promises
#   4. Remembered allergy notes unused for the period the client agreed to
#
# The log is public with the repository: every line carries counts only, and
# the note passes' errors carry a SQLSTATE only (packages/api/src/scripts/
# run-cleanup.ts).
#
# Can also be triggered manually from the GitHub Actions UI (workflow_dispatch).
#
# Requires the DATABASE_URL secret to be set in the repository settings, and
# the four PRIVATE_UPLOADS_R2_* secrets to delete orphaned uploads' objects;
# without those, orphaned uploads are kept and counted, never forgotten.
# =============================================================================

name: Scheduled Cleanup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    name: Run cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRIVATE_UPLOADS_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_UPLOADS_R2_ACCOUNT_ID }}
          PRIVATE_UPLOADS_R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_UPLOADS_R2_ACCESS_KEY_ID }}
          PRIVATE_UPLOADS_R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_UPLOADS_R2_SECRET_ACCESS_KEY }}
          PRIVATE_UPLOADS_R2_BUCKET: ${{ secrets.PRIVATE_UPLOADS_R2_BUCKET }}
        run: pnpm --filter @omnitwin/api cleanup
