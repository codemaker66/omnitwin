# =============================================================================
# OMNITWIN — Scheduled Cleanup
# =============================================================================
# Runs daily at 02:00 UTC to remove:
#   1. Stale preview configurations (unclaimed, >72h old, no enquiry)
#   2. Orphaned file rows (loadout context, >24h old, no photo link)
#   3. Guests' allergy notes past their retention (30 days after the event),
#      from layouts and their event sheets, as the privacy policy promises
#   4. Remembered allergy notes unused for the period the client agreed to
#   5. Engagement events past the enquiry funnel's retention (migration 0100)
#   6. Field web vitals older than 90 days (goal 07, migration 0109)
#
# Each pass runs even when an earlier one fails; the job then fails.
#
# Beside it, on the same schedule, the event-rules job joins records made
# since the last run to their events and reads the event rules
# (docs/engineering/the-spine.md). Neither job needs the other.
#
# The log is public with the repository: every line carries counts only, and
# the note passes' errors carry a SQLSTATE only (packages/api/src/scripts/
# run-cleanup.ts).
#
# Can also be triggered manually from the GitHub Actions UI (workflow_dispatch).
#
# Requires the DATABASE_URL secret to be set in the repository settings.
# =============================================================================

name: Scheduled Cleanup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    name: Run cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @omnitwin/api cleanup

  # The event rules every night (docs/engineering/the-spine.md): joins the
  # proposals, deals and enquiries made since the last run to their events,
  # then reads the bind's and the spine's counts and prints one line of JSON
  # (counts and kinds only; the log is public). A red run reports and blocks
  # nothing: the clean-up does not need it, and it does not need the clean-up.
  # Like the clean-up it names no environment, so no approval holds it and it
  # reads the repository's DATABASE_URL secret. The --join flag goes when the
  # rule is tightened (stage 6), after which this only reads.
  event-rules:
    name: Event rules (reports only; never blocks a release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @omnitwin/types (required by api)
        run: pnpm --filter @omnitwin/types build

      - name: Join old records and read the event rules
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @omnitwin/api exec tsx src/scripts/check-booking-event-bind.ts --join
