# =============================================================================
# OMNITWIN — Scheduled Cleanup
# =============================================================================
# Runs daily at 02:00 UTC to remove:
#   1. Stale preview configurations (unclaimed, >72h old, no enquiry)
#   2. Orphaned uploads (loadout context, >24h old, no photo link): the
#      object in the private uploads bucket, then its row
#   3. Guests' allergy notes past their retention (30 days after the event),
#      from layouts and their event sheets, as the privacy policy promises
#   4. Remembered allergy notes unused for the period the client agreed to
#   5. People and lone enquiries 24 months after our last contact, as the
#      privacy page promises (services/people-retention.ts): erased, at most
#      100 people and 200 enquiries a night, no new step after 150 s; off
#      until the first day the PEOPLE_RETENTION_STARTS_ON variable names has
#      come (from 00:00 UTC)
#   6. Engagement events older than the privacy page keeps an enquiry
#   7. Field web vitals older than 90 days (goal 07, migration 0109)
#
# Every pass runs even when one before it fails; the job then fails. The log
# is public with the repository: every line carries counts and SQLSTATEs only,
# never a name, an address or a database message (packages/api/src/scripts/
# run-cleanup.ts).
#
# Can also be triggered manually from the GitHub Actions UI (workflow_dispatch).
#
# Requires the DATABASE_URL secret to be set in the repository settings, and
# the four PRIVATE_UPLOADS_R2_* secrets to delete orphaned uploads' objects;
# without those, orphaned uploads are kept and counted, never forgotten. The
# optional PEOPLE_RETENTION_STARTS_ON variable (YYYY-MM-DD) starts the 24-month
# pass; unset, it is off.
# =============================================================================

name: Scheduled Cleanup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    name: Run cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRIVATE_UPLOADS_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_UPLOADS_R2_ACCOUNT_ID }}
          PRIVATE_UPLOADS_R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_UPLOADS_R2_ACCESS_KEY_ID }}
          PRIVATE_UPLOADS_R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_UPLOADS_R2_SECRET_ACCESS_KEY }}
          PRIVATE_UPLOADS_R2_BUCKET: ${{ secrets.PRIVATE_UPLOADS_R2_BUCKET }}
          # The 24-month pass erases nothing until this repository variable
          # holds its first day (YYYY-MM-DD; from 00:00 UTC that day); unset, it
          # is off.
          PEOPLE_RETENTION_STARTS_ON: ${{ vars.PEOPLE_RETENTION_STARTS_ON }}
        run: pnpm --filter @omnitwin/api cleanup
