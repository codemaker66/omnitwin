<style>
#hk-care{--hc-paper:#fffdf9;--hc-ivory:#faf8f2;--hc-ink:#352f28;--hc-muted:#686157;--hc-line:#e3ded2;--hc-green:#48664b;--hc-sage:#e5ebdf;--hc-honey:#f8e8c2;--hc-peach:#f7e6db;--hc-radius:14px;color:var(--hc-ink);background:var(--hc-paper);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.5;border:1px solid var(--hc-line);border-radius:22px;overflow:hidden;color-scheme:light;box-shadow:0 14px 40px #554b3412}
#hk-care *{box-sizing:border-box}#hk-care h1,#hk-care h2,#hk-care h3,#hk-care p{margin:0}#hk-care h1{font:400 31px/1.2 Georgia,serif}#hk-care h2{font-size:18px;font-weight:500}#hk-care h3{font-size:15px;font-weight:500}#hk-care p{overflow-wrap:anywhere}#hk-care button,#hk-care input,#hk-care textarea,#hk-care select{font:inherit;color:inherit}#hk-care button{background:var(--hc-paper);border:1px solid var(--hc-line);border-radius:9px;padding:9px 13px;min-height:44px;cursor:pointer;text-align:left}#hk-care button:hover{background:#f0eee6}#hk-care button:focus-visible,#hk-care textarea:focus-visible,#hk-care select:focus-visible,#hk-care input:focus-visible{outline:3px solid #48664b;outline-offset:3px}#hk-care button:disabled{opacity:.65;cursor:default}#hk-care button.primary{background:var(--hc-green);border-color:var(--hc-green);color:#fff}#hk-care button.quiet{background:transparent;border-color:transparent}#hk-care button.small{font-size:12px}#hk-care .muted{color:var(--hc-muted)}#hk-care .small{font-size:12px}#hk-care .label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--hc-muted)}#hk-care .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#hk-care .between{justify-content:space-between}#hk-care .stack{display:grid;gap:16px}#hk-care .chip{display:inline-flex;padding:4px 8px;border-radius:6px;background:var(--hc-sage);color:#3d533c;font-size:12px}#hk-care .chip.amber{background:var(--hc-honey);color:#6a4c19}#hk-care .top{display:flex;align-items:center;gap:18px;padding:20px 23px;border-bottom:1px solid var(--hc-line)}#hk-care .brand{display:flex;align-items:center;gap:12px;min-width:170px}#hk-care .brand-mark{width:30px;color:#8a795a}#hk-care .brand-name{font-size:12px;letter-spacing:1.8px}#hk-care .navigation{display:flex;gap:4px;flex:1}#hk-care .navigation button{border-color:transparent;background:transparent}#hk-care .navigation button[aria-pressed=true]{background:var(--hc-sage);color:var(--hc-green)}#hk-care .layout{display:grid;grid-template-columns:148px minmax(0,1fr) 242px;min-height:655px}#hk-care .rooms{padding:22px 11px;background:var(--hc-ivory);border-right:1px solid var(--hc-line)}#hk-care .room-select{display:block;width:100%;margin-top:12px;padding:12px 10px;background:transparent;border-color:transparent}#hk-care .room-select[aria-pressed=true]{background:#eff2e9;border-color:#bac8b1}#hk-care .room-select span{display:block;font-size:11px;color:var(--hc-muted);margin-top:3px}#hk-care .room-note{border-top:1px solid var(--hc-line);margin-top:27px;padding:17px 5px;display:grid;gap:5px}#hk-care .main{padding:27px 24px;min-width:0}#hk-care .main-head{display:grid;gap:9px;margin-bottom:23px}#hk-care .hero{background:var(--hc-sage);border:1px solid #c5d1bc;border-radius:var(--hc-radius);padding:19px;display:grid;gap:11px;margin:18px 0}#hk-care .hero h2{font:23px/1.25 Georgia,serif}#hk-care .hero-foot{border-top:1px solid #c6d1be;padding-top:12px;margin-top:3px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:12px}#hk-care .task-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--hc-line)}#hk-care .task-row:last-child{border-bottom:0}#hk-care .time{font-variant-numeric:tabular-nums;color:#76664e;font-size:13px}#hk-care .task-row button{font-size:12px}#hk-care .person{display:flex;align-items:flex-start;gap:12px;padding:18px 0;border-bottom:1px solid var(--hc-line)}#hk-care .avatar{width:37px;height:37px;border-radius:50%;background:#e9dfcf;display:grid;place-items:center;flex-shrink:0;color:#6b5b42}#hk-care .person-body{flex:1;display:grid;gap:6px}#hk-care .aside{padding:24px 17px;background:var(--hc-ivory);border-left:1px solid var(--hc-line);display:flex;flex-direction:column;gap:16px}#hk-care .aside-card{border:1px solid #dfd0aa;background:#fffaf0;border-radius:var(--hc-radius);padding:15px;display:grid;gap:9px}#hk-care .aside-card.calm{background:var(--hc-paper);border-color:var(--hc-line)}#hk-care .aside-foot{margin-top:auto;border-top:1px solid var(--hc-line);padding-top:16px;display:grid;gap:7px}#hk-care .note{background:var(--hc-peach);border-radius:9px;padding:13px 15px;margin:16px 0;font-size:13px;color:#694d39}#hk-care .inset{background:#f4f1e8;border-radius:var(--hc-radius);padding:17px;margin:17px 0;display:grid;gap:9px}#hk-care .divide{border:0;border-top:1px solid var(--hc-line);margin:20px 0}#hk-care .line{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--hc-line);padding:12px 0}#hk-care .line:last-child{border:0}#hk-care .line>span:last-child{color:var(--hc-muted);font-size:12px;text-align:right}#hk-care .outcome{padding:12px 0;display:grid;gap:6px}#hk-care .outcome strong{font-weight:500}#hk-care .plan{background:#f5f1e8;border:1px solid #dcd4c3;border-radius:12px;padding:17px;margin:18px 0}#hk-care .tables{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}#hk-care .table-mark{width:100%;max-width:39px;aspect-ratio:1;margin:auto;border-radius:50%;border:1px solid #b8b09d;background:#fffdf7;display:grid;place-items:center;font-size:11px;color:#6c624f}#hk-care .table-mark.added{background:#f7dfb1;border-color:#c39d4f}#hk-care .plan-landmark{border-bottom:3px solid #b5b9a6;text-align:center;padding:4px 0 9px;font-size:12px}#hk-care .plan-entry{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#6b6252}#hk-care textarea{width:100%;min-height:85px;border:1px solid #cfc7b6;border-radius:8px;padding:11px;background:var(--hc-paper);resize:vertical;font-size:16px}#hk-care select{font-size:16px;max-width:100%;padding:9px;border:1px solid #cfc7b6;border-radius:8px;background:var(--hc-paper)}#hk-care label{display:grid;gap:7px;margin:13px 0}#hk-care input[type=checkbox]{width:19px;height:19px;accent-color:var(--hc-green)}#hk-care .check{display:flex;align-items:center;gap:10px;padding:5px 0}#hk-care .compare{width:100%;border-collapse:collapse;margin:16px 0;font-variant-numeric:tabular-nums}#hk-care .compare th,#hk-care .compare td{border-bottom:1px solid var(--hc-line);padding:10px 6px;text-align:right;font-weight:400}#hk-care .compare th{font-size:11px;color:var(--hc-muted)}#hk-care .compare th:first-child,#hk-care .compare td:first-child{text-align:left}#hk-care .compare td:last-child{background:#fbefcf}#hk-care .example{margin-top:22px;border-top:1px dashed #cfc6b1;padding-top:14px;display:grid;gap:10px}#hk-care .example .label{font-size:11px}#hk-care .example button{font-size:12px;background:#f6f2e9}#hk-care .footer{border-top:1px solid var(--hc-line);padding:12px 22px;font-size:11px;color:#665f51;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;background:#f7f4ed}#hk-care .message{font-size:12px;color:var(--hc-green);min-height:18px}#hk-care .guest{padding:30px;max-width:780px;margin:auto;min-height:640px}#hk-care .guest h1{font-size:35px}#hk-care .guest .hero{margin:27px 0}#hk-care .guest .guest-note{font:21px/1.45 Georgia,serif}#hk-care .undo{font-size:12px;border:0;background:transparent;text-decoration:underline}#hk-care .mobile-promise{display:none}
@media(max-width:850px){#hk-care .layout{grid-template-columns:131px minmax(0,1fr)}#hk-care .aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--hc-line);display:grid;grid-template-columns:1fr 1fr;align-items:start}#hk-care .aside>h2{grid-column:1/-1}#hk-care .aside-foot{margin-top:0}#hk-care .top{padding:16px;gap:8px}#hk-care .brand{min-width:156px}#hk-care .main{padding:24px 20px}}
@media(max-width:560px){#hk-care{border-radius:14px}#hk-care .top{flex-wrap:wrap;justify-content:space-between}#hk-care .navigation{order:3;flex-basis:100%}#hk-care .navigation button{flex:1;text-align:center}#hk-care .layout{display:block}#hk-care .rooms{display:flex;padding:11px;gap:5px;border-right:0;border-bottom:1px solid var(--hc-line)}#hk-care .rooms>.label,#hk-care .room-note{display:none}#hk-care .room-select{margin:0;padding:10px 7px;text-align:center}#hk-care .main{padding:24px 17px}#hk-care h1{font-size:27px}#hk-care .aside{display:block;padding:20px 17px}#hk-care .aside-card{margin-top:14px}#hk-care .aside-foot{margin-top:19px}#hk-care .task-row{grid-template-columns:41px 1fr;gap:8px}#hk-care .task-row button{grid-column:2;justify-self:start}#hk-care .hero{padding:16px}#hk-care .line{flex-wrap:wrap}#hk-care .line>span:last-child{text-align:left}#hk-care .guest{padding:22px 17px}#hk-care .guest h1{font-size:29px}#hk-care .tables{gap:10px}#hk-care .mobile-promise{display:block;font-size:12px;background:var(--hc-honey)}#hk-care .person{flex-wrap:wrap}#hk-care .top>span.small{display:none}}
#hk-care{--hc-prep:#eee5d5;--hc-setup:#f5dccb;--hc-check:#f8e8bd;--hc-event:#dfe8d8;--hc-reset:#dfe9ec;--hc-handback:#e9e2ee}
#hk-care .event-days{margin:24px 0 27px}#hk-care .event-days>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}#hk-care .stage-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}#hk-care .stage{display:grid;gap:4px;align-content:start;min-width:0;min-height:77px;padding:12px 10px;background:var(--stage-colour);border-color:transparent;border-radius:9px}#hk-care .stage:hover{background:var(--stage-colour);border-color:#8a8173}#hk-care .stage[aria-pressed=true]{border-color:#5e6657;box-shadow:inset 0 0 0 1px #5e6657}#hk-care .stage-name{font-size:13px;font-weight:500}#hk-care .stage-time{font-size:11px;line-height:1.4;color:#5b554d}#hk-care .stage-prefix{opacity:.75;margin-right:5px;font-size:11px}#hk-care .stage-detail{border:1px solid var(--hc-line);border-top:4px solid var(--stage-colour);padding:16px;border-radius:0 0 12px 12px;margin-top:10px;background:var(--hc-paper);display:grid;gap:9px}#hk-care .stage-detail p{font-size:13px}#hk-care .stage-detail header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}#hk-care .viewing-stage{font-size:11px;color:var(--hc-muted)}#hk-care .stage-note{font-size:11px;color:var(--hc-muted);margin-top:10px}#hk-care .deadline-pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #c6d1be;padding-top:13px;margin-top:5px;gap:13px}#hk-care .deadline-pair>div{display:grid;gap:3px}#hk-care .deadline-pair>div+div{border-left:1px solid #c6d1be;padding-left:16px}#hk-care .deadline-pair strong{font:400 29px/1.2 Georgia,serif;color:#405c42}#hk-care .deadline-pair span{font-size:12px}#hk-care .stage-task{border-left:4px solid var(--stage-colour);padding-left:12px}#hk-care .stage-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--hc-muted);margin-top:3px}#hk-care .stage-dot{width:9px;height:9px;border-radius:3px;background:var(--stage-colour);border:1px solid #aaa391}
@media(max-width:560px){#hk-care .stage-strip{grid-template-columns:repeat(2,minmax(0,1fr))}#hk-care .stage{min-height:75px}#hk-care .stage-detail{padding:13px}#hk-care .event-days>header .small{font-size:11px}#hk-care .deadline-pair strong{font-size:27px}}
</style>
<div id="hk-care" aria-label="Hallkeeper care and craft interactive concept"><div id="hc-screen"></div><div class="footer"><span>Fictional walkthrough · Every reply and action is simulated</span><span>No messages sent · No live venue data</span></div></div>
<script>
(()=>{
const root=document.getElementById('hk-care');
const screen=root.querySelector('#hc-screen');
const state={view:'today',room:'grand',received:{grand:null,saloon:null,reception:null},clarifications:{},questionDrafts:{},work:{grand:{active:false,linen:false},saloon:{active:false,linen:false},reception:{active:false,linen:false}},arranged:false,change:'requested',revision:7,count:120,clientTold:false,changeUpdateMissed:false,changeNextUpdate:null,care:'draft',careTechnicalOpen:false,careWorker:'Sam',careNote:'The room feels cold where Daniel is sitting.',updateGiven:false,careOutcome:null,cover:'none',breakActive:false,shift:'none',handoverNote:'',handoverSaved:false,bookmarks:{},resumeRoom:null,message:'',lastView:'today'};
const rooms={grand:{name:'Grand Hall',event:'Heritage Trust Dinner',count:120,tables:20,revision:7,ready:'17:15',doors:'18:00',intent:'Daniel wants every table to feel part of the speeches.',anchor:'Presentation wall',orientation:'View from the arrival doorway',fixed:'Keep the agreed presentation area available for the AV team.',discretion:'Finish the table alignment in your usual working order.',store:'West store · allocated tables and chairs',step:'Grand Hall · furniture collection · 15:30'},saloon:{name:'Saloon',event:'Board Meeting',count:10,tables:1,revision:3,ready:'14:45',doors:'15:00',intent:'Everyone should see the screen and hear each other.',anchor:'Screen wall',orientation:'View from the meeting-room doorway',fixed:'Keep the agreed screen position and accessible seat.',discretion:'Arrange water and stationery neatly within the agreed places.',store:'Meeting store · conference kit',step:'Saloon · meeting-kit check · 14:20'},reception:{name:'Reception',event:'Evening welcome',count:120,tables:2,revision:2,ready:'17:30',doors:'18:00',intent:'A clear welcome, with someone available to help.',anchor:'Welcome desk',orientation:'View from the guest entrance',fixed:'Keep the agreed arrival space clear of stored equipment.',discretion:'Group welcome materials where the host can reach them.',store:'Welcome store · signs and supplies',step:'Reception · welcome-point preparation · 16:00'}};
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,style='',extra='')=>'<button type="button" class="'+style+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
const chip=(text,amber=false)=>'<span class="chip'+(amber?' amber':'')+'">'+text+'</span>';
const message=()=>'<p class="message" role="status">'+esc(state.message)+'</p>';
const room=()=>{const r={...rooms[state.room]};if(state.room==='grand'){r.count=state.count;r.tables=state.count/6;r.revision=state.revision;}return r;};
const work=()=>state.work[state.room];
const viewedStage={grand:null,saloon:null,reception:null};
const stageDefinitions=[
{id:'prep',name:'Preparation',time:'12:00–14:00',title:'Receive the brief',copy:'Receive the issued brief, check what matters to the organiser and attach any question to the right instruction.',action:'room',actionLabel:'Receive this room’s brief'},
{id:'setup',name:'Setup',time:'14:00–16:45',title:'Prepare the room',copy:'Check the room as found, collect the complete kit and keep useful work in place. Grand Hall furniture collection is planned for 15:30, after the proposed break.',action:'kit',actionLabel:'Open the room kit'},
{id:'check',name:'Room checks',time:'16:45–17:15',title:'Final room checks',copy:'The AV lead owns the 16:45 test. Review the physical room against the issued brief by 17:15. Doors remain at 18:00; choosing this stage does not release the room.',action:'stage-room',actionLabel:'Review the arrangement'},
{id:'event',name:'Event & hosting',time:'Doors 18:00 · End to agree',title:'Host the event',copy:'Give the organiser your attention, keep update promises and involve the right colleague when help is needed. The sage colour identifies hosting; it does not confirm readiness.',action:'people',actionLabel:'Open the organiser brief'},
{id:'reset',name:'Clear & reset',time:'Departure & reset · Time to agree',title:'Clear and reset',copy:'Check condition and remaining belongings together before the client leaves. Record actual departure, remaining suppliers and collections. Cleaning waits until the room is handed over for it; reset and next-use checks stay separate.',action:'stage-handover',actionLabel:'Review remaining responsibilities'},
{id:'handback',name:'Handback',time:'After reset checks · Time to agree',title:'Hand back the room',copy:'Record the room’s actual condition and next-use check. Transfer open work to an accepting colleague. A client departure, a cleared room and an accepted staff handover are different records.',action:'stage-handover',actionLabel:'Open the staff handover'}
];
function eventStages(){
 const r=room(),selected=stageDefinitions.find(s=>s.id===viewedStage[state.room])||stageDefinitions[0];
 const stageTime=s=>state.room==='grand'?s.time:s.id==='check'?'Complete by '+r.ready:s.id==='event'?'Doors '+r.doors+' · End to agree':s.id==='reset'||s.id==='handback'?s.time:'Time to agree';
 const copy=state.room==='grand'?selected.copy:selected.id==='setup'?'Check this room as found, collect its own kit and retain useful work. A setup slot still needs agreeing for this example.':selected.id==='check'?'Review '+r.name+' against brief v'+r.revision+' by '+r.ready+'. The event opens at '+r.doors+'. Required check outcomes remain unrecorded in this example.':selected.id==='event'?'Check the meeting or welcome host’s agreed needs. Staff coordination and care remain available; the room’s host details have not been supplied in this example.':selected.copy;
 const action=state.room!=='grand'&&selected.id==='event'?'room':selected.action;
 const actionLabel=state.room!=='grand'&&selected.id==='event'?'Review this event’s brief':selected.actionLabel;
 return '<section class="event-days" aria-label="Event life stages"><header><h2>The event’s day</h2></header><div class="stage-strip">'+stageDefinitions.map((s,i)=>'<button type="button" class="stage" style="--stage-colour:var(--hc-'+s.id+')" data-action="select-stage" data-stage="'+s.id+'" aria-pressed="'+(s.id===viewedStage[state.room])+'"><span class="stage-name"><span class="stage-prefix">'+(i+1)+'</span>'+s.name+'</span><span class="stage-time">'+stageTime(s)+'</span></button>').join('')+'</div>'+(viewedStage[state.room]?'<div class="stage-detail" style="--stage-colour:var(--hc-'+selected.id+')"><header><h3>'+selected.title+'</h3><span class="viewing-stage" role="status">Viewing '+selected.name+'</span></header><p>'+copy+'</p><div>'+button(actionLabel,action,'small')+'</div></div>':'')+'<p class="stage-note">Stage colours show the kind of work. Times are planned; completion and release are recorded separately.</p></section>';
}
const careContact=()=>state.breakActive||state.shift==='accepted'?'Maya':'Nora';
const updateTime=()=>state.updateGiven?'14:35':'14:25';
const careStatus=()=>({draft:'Not yet raised',waiting:state.careWorker+' has been asked · not accepted',unassigned:'Ellis needs to arrange technical cover',accepted:state.careWorker+' is checking · update due '+updateTime(),delayed:'Still being checked · finish time unknown',fixed:'Adjustment made · ask Daniel how it feels',unresolved:'Daniel still needs help · '+state.careWorker+' to reassess',awaitingEllis:'Alternative requested from Ellis · not yet accepted',alternative:'Ellis has the alternative · Daniel has not agreed',alternativeAgreed:'Daniel agreed the alternative · experience still to check',resolved:state.careTechnicalOpen?'Daniel is comfortable · technical reassessment remains open':'Daniel confirmed the outcome'}[state.care]);
const changeStatus=()=>state.clientTold?('Daniel updated · '+state.count+(state.change==='issued'?' places issued':' places retained')):({requested:'12 more guests requested',waiting:'Ellis asked · awaiting acceptance',accepted:'Ellis has the decision',late:'No answer yet · involve duty cover',escalated:'Duty cover asked · awaiting acceptance',option:'Checked option · Daniel’s agreement needed',agreed:'Daniel agreed · v8 not yet issued',declined:'Daniel declined the changed offer · 120 retained',issued:'Brief v8 issued · tell Daniel',noFit:'120 retained · explain the alternative'}[state.change]);
const received=()=>state.received[state.room]===room().revision;
const bookmark=()=>state.bookmarks[state.resumeRoom];
const changePromise=()=>state.clientTold?'Daniel has received the answer':state.changeNextUpdate?'Daniel updated after delay · next update '+state.changeNextUpdate:state.changeUpdateMissed?'14:25 update missed · speak to Daniel and agree the next update':'Next update by 14:25';
function remember(){if(!['room','kit'].includes(state.view))return;const old=state.bookmarks[state.room];state.bookmarks[state.room]=old||{room:state.room,view:work().active?'kit':state.view,step:work().active?rooms[state.room].step:'Review '+rooms[state.room].name+' brief',revision:room().revision,note:''};state.resumeRoom=state.room;}
function top(){return '<header class="top"><div class="brand"><span class="brand-mark"><i data-lucide="landmark" aria-hidden="true"></i></span><div><div class="brand-name">HILLSIDE HOUSE</div><div class="label">Hallkeeper</div></div></div><nav class="navigation" aria-label="Workspace"><button data-action="today" aria-pressed="'+(state.view==='today')+'">Today</button><button data-action="room" aria-pressed="'+(['room','kit','clarify'].includes(state.view))+'">This room</button><button data-action="people" aria-pressed="'+(state.view==='people')+'">People</button></nav>'+button('Handover','handover','small')+'<span class="small muted">'+(state.shift==='accepted'?'Maya · Incoming':state.breakActive?'Maya · Covering':'Nora · On duty')+'</span></header>';}
function left(){return '<aside class="rooms" aria-label="Choose a room"><div class="label" style="padding-left:8px">Your rooms</div>'+Object.entries(rooms).map(([id,r])=>'<button class="room-select" data-action="choose-room" data-room="'+id+'" aria-pressed="'+(state.room===id)+'">'+r.name+'<span>'+r.ready+' ready-by</span></button>').join('')+'<div class="room-note"><span class="label">Break cover</span><span class="small">Maya · 15:00–15:20</span><span class="small muted">'+(state.shift==='accepted'?'Nora’s shift handed over.':state.breakActive?'Maya is covering now.':state.cover==='returned'?'Return agreed. Nora is on duty.':state.cover==='accepted'?'Cover agreed. Confirm the start together.':'Break cover still needs acceptance.')+'</span></div></aside>';}
function aside(){const careOpen=state.care!=='draft'&&state.care!=='resolved';const needsTell=['issued','noFit'].includes(state.change)&&!state.clientTold;return '<aside class="aside" aria-label="Promises and colleagues"><h2>Promises to keep</h2><div class="aside-card"><span class="label">Daniel · organiser</span><h3>'+(careOpen?'Check that he is comfortable':needsTell?'Give Daniel the answer':'A calm welcome at 14:30')+'</h3><p class="small muted">'+(careOpen?esc(careContact())+' stays his contact. '+esc(careStatus()):needsTell?'The office has answered. Daniel has not been told yet.':'Know what matters to him. Then put the screen away.')+'</p>'+button(careOpen?'Open care request':needsTell?'View the answer':'Prepare to greet Daniel',careOpen?'care':needsTell?'change':'people','small')+'</div><div class="aside-card calm"><span class="label">With the office</span><h3>'+changeStatus()+'</h3><p class="small muted">'+(state.change==='issued'?'Extra tables, chairs and linen are needed. The AV work is retained.':'Ellis owns the guest-count decision. The issued brief is '+state.count+' guests.')+'</p>'+button('Open request','change','small')+'</div></aside>';}

function render(){const focusStage=screen.contains(document.activeElement)?document.activeElement.dataset.stage:null;const focusAction=screen.contains(document.activeElement)?document.activeElement.dataset.action:null;const content={today,room:roomView,kit,people,change,care,handover,clarify};if(state.view==='guest')screen.innerHTML=guest();else screen.innerHTML=top()+'<div class="layout">'+left()+'<main class="main">'+content[state.view]()+'</main>'+aside()+'</div>';if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});if(focusAction){const match=[...screen.querySelectorAll('[data-action]')].find(e=>e.dataset.action===focusAction&&(!focusStage||e.dataset.stage===focusStage)&&!e.disabled);if(match)match.focus({preventScroll:true});else screen.querySelector('main button.primary:not(:disabled), main button:not(:disabled), .guest button')?.focus({preventScroll:true});}}
function go(view){state.message='';state.view=view;render();screen.querySelector('.main-head')?.scrollIntoView({block:'start'});}
function resume(){const b=bookmark();if(b){state.room=b.room;state.view=b.view;state.message='Back at '+b.step+'. '+(b.revision!==room().revision?'The event brief changed while you were away; review the highlighted furniture difference.':'Your place and recorded progress are retained.');}else state.view='today';render();}
root.addEventListener('input',e=>{if(e.target.id==='hc-question')state.questionDrafts[state.room]=e.target.value;if(e.target.id==='hc-bookmark'&&state.bookmarks[state.room])state.bookmarks[state.room].note=e.target.value;if(e.target.id==='hc-care-note')state.careNote=e.target.value;if(e.target.id==='hc-handover-note')state.handoverNote=e.target.value;});
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;state.message='';
if(['today','room','people','kit'].includes(a)){remember();go(a);}
else if(a==='select-stage'&&stageDefinitions.some(s=>s.id===b.dataset.stage)){viewedStage[state.room]=b.dataset.stage;render();}else if(a==='stage-room'){remember();go('room');}else if(a==='stage-handover'){remember();go('handover');}
else if(a==='choose-room'){remember();state.room=b.dataset.room;go(['room','kit','clarify'].includes(state.view)?'room':'today');}
else if(a==='grand-kit'){state.room='grand';go('kit');}else if(a==='grand-room'){state.room='grand';go('room');}
else if(a==='understood'){state.received[state.room]=room().revision;state.message='Receipt recorded. This does not release the room.';render();}
else if(a==='clarify'||a==='unworkable'){remember();go('clarify');}
else if(a==='save-question'){const text=root.querySelector('#hc-question').value.trim();if(!text){state.message='Add the one answer you need.';render();return;}state.clarifications[state.room]={text,revision:room().revision,accepted:false};state.message='Context attached: '+room().name+', '+room().event+', v'+room().revision+'.';render();}
else if(a==='accept-question'){const q=state.clarifications[state.room];if(q)q.accepted=true;render();}
else if(a==='start-work'){work().active=true;state.bookmarks[state.room]={room:state.room,view:'kit',step:rooms[state.room].step,revision:room().revision,note:state.bookmarks[state.room]?.note||''};state.resumeRoom=state.room;state.message='Your place is kept here when another job interrupts.';render();}
else if(a==='linen'){work().linen=true;state.message='Collection recorded for '+room().name+'. Correct it if that was a mistake.';render();}
else if(a==='undo-linen'){work().linen=false;state.message='Corrected: collection is still to do in '+room().name+'. Other work is unchanged.';render();}
else if(a==='care'||a==='change'){remember();go(a);}
else if(a==='guest'){state.lastView=state.view;go('guest');}else if(a==='return-staff')go(state.lastView);else if(a==='resume')resume();
else if(a==='send-change'){state.change='waiting';render();}else if(a==='accept-change'){state.change='accepted';render();}else if(a==='late-change'){state.change='late';state.changeUpdateMissed=true;render();}else if(a==='escalate'){state.change='escalated';render();}else if(a==='option-change'){state.change='option';render();}else if(a==='agree-change'){state.change='agreed';render();}else if(a==='decline-change'){state.change='declined';state.clientTold=true;render();}else if(a==='update-change'){state.changeNextUpdate='14:35';render();}else if(a==='no-fit'){state.change='noFit';state.clientTold=false;render();}else if(a==='issue-change'&&state.change==='agreed'){state.change='issued';state.count=132;state.revision=8;state.arranged=false;state.clientTold=false;render();}else if(a==='tell-client'){state.clientTold=true;render();}
else if(a==='send-care'){if(!state.careNote.trim()){state.message='Record what Daniel needs help with.';render();return;}state.care='waiting';state.careTechnicalOpen=true;render();}else if(a==='accept-care'){state.care='accepted';render();}else if(a==='decline-care'){state.care='unassigned';state.message='Sam is unavailable. Ellis needs to arrange another responder; Daniel still has his contact.';render();}else if(a==='assign-pat'){state.careWorker='Pat';state.care='accepted';render();}else if(a==='delay-care'){state.care='delayed';render();}else if(a==='fix-care'){state.care='fixed';state.careTechnicalOpen=false;render();}else if(a==='update-care'){state.updateGiven=true;render();}else if(a==='confirm-care'){state.care='resolved';state.careOutcome='confirmed';render();}else if(a==='reopen-care'){state.care='unresolved';state.careTechnicalOpen=true;state.careOutcome='not met';render();}else if(a==='defer-care'){state.message='Client outcome remains unconfirmed. The check-back stays in the handover.';render();}else if(a==='escalate-care'){state.care='awaitingEllis';render();}else if(a==='accept-alternative'){state.care='alternative';render();}else if(a==='agree-alternative'){state.care='alternativeAgreed';render();}
else if(a==='handover'){remember();go('handover');}else if(a==='save-handover'){state.handoverSaved=true;state.message='Prepared brief saved. No extra note required. Cover is not implied.';render();}else if(a==='review-handover'){state.message='Check the brief and open promises together; the incoming person then accepts the agreed scope.';render();}else if(a==='accept-cover'&&state.shift!=='accepted'&&!state.breakActive){state.cover='accepted';render();}else if(a==='decline-cover'&&state.shift!=='accepted'&&!state.breakActive){state.cover='declined';state.breakActive=false;render();}else if(a==='begin-break'&&state.cover==='accepted'&&state.shift!=='accepted'){state.breakActive=true;render();}else if(a==='return-break'&&state.breakActive&&state.shift!=='accepted'){state.breakActive=false;state.cover='returned';state.message='Return recorded with Maya. Nora has the routine duties and client follow-up again.';render();}else if(a==='accept-shift'){state.shift='accepted';state.breakActive=false;state.message='Example acceptance recorded. Open work remains open under the incoming owner.';render();}
});
render();
const design={corners:14};if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--hc-radius',design.corners+'px')});tweak.addSlider(design,'corners',{label:'Card corners',min:8,max:20,unit:'px'});}
})();
</script>
