    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; }

      /* T-615 — ONE REGISTER. Three cockpit-era globals used to live here: a
         golden arrow cursor, a gold gradient scrollbar, and a 1.06x hover pop
         plus overshoot spring on EVERY <button> and [role="button"] in the app.
         All three are deleted, not re-scoped. They were the loudest source of
         a second visual register, the cursor overrode the OS pointer on every
         route but the homepage, and the pop fired on controls that were never
         designed to move (table rows, nav items, disclosure summaries). Press
         feedback now belongs to the planner shell alone, as a spring, in
         src/App.css. Do NOT reintroduce a global hover transform here: a
         control that wants motion declares it at its own source, where its
         reduced-motion and disabled states can be reasoned about.

         The ivory ground is the register's page colour; it is repeated in
         src/global.css so it holds whichever sheet lands last. The dark
         graphite ground survives only inside the 3D viewport, painted by the
         shells that own it (.venviewer-planner-shell, .vv-twin), each a
         full-bleed surface over this ground. */
      html, body {
        background: #f2edda;
        color: #1b3a2f;
      }

      /* Scrollbar: register furniture, not decoration — a sage thumb that
         darkens to forest on hover, over the surface's own ground. Dark
         subsystems declare `color-scheme: dark` and get the matching track. */
      * {
        scrollbar-width: thin;
        scrollbar-color: #8fae8b transparent;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 8px;
        background: #8fae8b;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a6650;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-corner { background: transparent; }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
